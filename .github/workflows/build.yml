# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build Release

on : [push, pull_request]

env:
  ## set env
  git_sha: ${{github.sha}}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/generated
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle
      - uses: actions/checkout@v4
      - uses: BrycensRanch/read-properties-action@v1
        id: version
        with:
          file: gradle.properties
          property: version
          default: 1.0.0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
      - name: Set version env
        run: echo "RELEASE_VERSION=${GITHUB_REF:10}" >> $GITHUB_ENV
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload common binaries to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-common-${{steps.version.outputs.value}}-${{github.sha}}.jar
          path: common/build/libs/chromosomelib-common-${{steps.version.outputs.value}}.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload common sources to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-common-${{steps.version.outputs.value}}-${{github.sha}}-sources.jar
          path: common/build/libs/chromosomelib-common-${{steps.version.outputs.value}}-sources.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload common javadoc to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-common-${{steps.version.outputs.value}}-${{github.sha}}-javadoc.jar
          path: common/build/libs/chromosomelib-common-${{steps.version.outputs.value}}-javadoc.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload fabric binaries to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-fabric-${{steps.version.outputs.value}}-${{github.sha}}.jar
          path: fabric/build/libs/chromosomelib-fabric-${{steps.version.outputs.value}}.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload fabric sources to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-fabric-${{steps.version.outputs.value}}-${{github.sha}}-sources.jar
          path: fabric/build/libs/chromosomelib-fabric-${{steps.version.outputs.value}}-sources.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload fabric javadoc to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-fabric-${{steps.version.outputs.value}}-${{github.sha}}-javadoc.jar
          path: fabric/build/libs/chromosomelib-fabric-${{steps.version.outputs.value}}-javadoc.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload forge binaries to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-forge-${{steps.version.outputs.value}}-${{github.sha}}.jar
          path: forge/build/libs/chromosomelib-forge-${{steps.version.outputs.value}}.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload forge sources to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-forge-${{steps.version.outputs.value}}-${{github.sha}}-sources.jar
          path: forge/build/libs/chromosomelib-forge-${{steps.version.outputs.value}}-sources.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
      - name: Upload forge javadoc to release
        uses: actions/upload-artifact@v4
        with:
          name: chromosomelib-forge-${{steps.version.outputs.value}}-${{github.sha}}-javadoc.jar
          path: forge/build/libs/chromosomelib-forge-${{steps.version.outputs.value}}-javadoc.jar
          repo-token:  ${{ secrets.ACTION_TOKEN }}
